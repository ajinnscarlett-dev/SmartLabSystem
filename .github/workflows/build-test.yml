name: SmartLab Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: smartlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2025

    env:
      SMARTLAB_JWT_KEY: SmartLab-CI-Only-Test-Key-2026-At-Least-32-Chars!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: false

      - name: Install EF tool
        shell: pwsh
        run: dotnet tool install --global dotnet-ef --version 8.0.29

      - name: Restore
        run: dotnet restore SmartLabSystem.sln

      - name: Build
        run: dotnet build SmartLabSystem.sln --configuration Release --no-restore

      - name: Diagnose EF model differences
        working-directory: SmartLab.Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $migrationName = "__CiModelProbe"
          dotnet ef migrations add $migrationName --configuration Release --no-build --output-dir Migrations/CiProbe
          Write-Host "=== GENERATED EF PROBE ==="
          Get-ChildItem Migrations/CiProbe -Filter "*.cs" | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName
          }
          Write-Host "=== SNAPSHOT DIFF ==="
          git diff -- Migrations/AppDbContextModelSnapshot.cs
          Remove-Item Migrations/CiProbe -Recurse -Force
          git checkout -- Migrations/AppDbContextModelSnapshot.cs

      - name: EF model validation
        run: dotnet ef migrations has-pending-model-changes --configuration Release --no-build

      - name: Test
        run: dotnet test SmartLabSystem.sln --configuration Release --no-build
