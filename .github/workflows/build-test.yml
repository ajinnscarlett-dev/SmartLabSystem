name: SmartLab Build and Test

on:
  push:
    branches: [ main, capstone-hardening-20260917 ]
  pull_request:
    branches: [ main ]

concurrency:
  group: smartlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2025

    env:
      SMARTLAB_JWT_KEY: SmartLab-CI-Only-Test-Key-2026-At-Least-32-Chars!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: false

      - name: Install EF tool
        shell: pwsh
        run: dotnet tool install --global dotnet-ef --version 8.0.29

      - name: Restore
        run: dotnet restore SmartLabSystem.sln

      - name: Build
        run: dotnet build SmartLabSystem.sln --configuration Release --no-restore

      - name: EF model validation
        working-directory: SmartLab.Server
        run: dotnet ef migrations has-pending-model-changes --configuration Release --no-build

      - name: Start isolated SQL Server test instance
        shell: pwsh
        run: sqllocaldb start MSSQLLocalDB

      - name: Test including SQL Server integration
        env:
          SMARTLAB_TEST_SQLSERVER: 'Server=(localdb)\MSSQLLocalDB;Database=master;Integrated Security=true;TrustServerCertificate=true;'
        run: dotnet test SmartLabSystem.sln --configuration Release --no-build --logger "trx;LogFileName=hardening.trx" --results-directory TestResults

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-test-results
          path: TestResults/*.trx
